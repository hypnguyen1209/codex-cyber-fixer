name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate the release on a green lint/test run and a tag that matches the crate
  # version, so a mistagged or broken commit never ships binaries.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        run: |
          MANIFEST="$(cargo metadata --format-version=1 --no-deps \
            | jq -r '.packages[] | select(.name == "codex-cyber-fixer") | .version')"
          EXPECTED="v${MANIFEST}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version (${EXPECTED}). Bump Cargo.toml or retag."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches Cargo.toml version ${EXPECTED}."

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

  build:
    needs: check
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: ""
            cross_linker: aarch64-linux-gnu-gcc
            apt_packages: gcc-aarch64-linux-gnu
          - name: darwin-x64
            # Cross-compile the Intel binary on an Apple-Silicon runner: the
            # macos-13 (Intel) pool has a long queue and stalls releases.
            # macos-14's toolchain targets x86_64 fine and starts quickly.
            os: macos-14
            target: x86_64-apple-darwin
            ext: ""
          - name: darwin-arm64
            os: macos-14
            target: aarch64-apple-darwin
            ext: ""
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker (linux-arm64)
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross_linker }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary per platform
        shell: bash
        run: |
          ASSET="codex-cyber-fixer-${{ matrix.name }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/codex-cyber-fixer${{ matrix.ext }}" "${ASSET}"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: codex-cyber-fixer-${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        working-directory: artifacts
        run: |
          # Name the archives explicitly so checksums.txt cannot hash itself.
          sha256sum codex-cyber-fixer-* > checksums.txt
          cat checksums.txt

      - name: Verify every published asset is checksummed
        working-directory: artifacts
        run: |
          status=0
          for f in codex-cyber-fixer-*; do
            if ! grep -q "  ${f}\$" checksums.txt; then
              echo "::error::Asset ${f} is missing from checksums.txt"
              status=1
            fi
          done
          exit "${status}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
