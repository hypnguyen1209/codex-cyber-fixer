name: build

# Normal pushes / PRs run a fast CI check on one OS. The full per-OS matrix
# (which builds the bundled SQLite from source) and the GitHub Release upload
# only run on a `v*` tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast CI: test + release build on a single runner. Skipped on tags.
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release

  # Build every target on its native runner and upload each binary as an
  # artifact. Only runs on a `v*` tag.
  build:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: codex-cyber-fixer-windows-x64.exe
            bin: codex-cyber-fixer.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: codex-cyber-fixer-linux-x64
            bin: codex-cyber-fixer
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: codex-cyber-fixer-linux-arm64
            bin: codex-cyber-fixer
            cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            name: codex-cyber-fixer-darwin-x64
            bin: codex-cyber-fixer
          - os: macos-latest
            target: aarch64-apple-darwin
            name: codex-cyber-fixer-darwin-arm64
            bin: codex-cyber-fixer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux arm64: cross-compile SQLite's C with a gcc cross-toolchain.
      - name: Install aarch64 cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # Tests only run where the binary runs natively (skip the cross target).
      - name: Test
        if: '!matrix.cross'
        run: cargo test --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  # Gather all built binaries and publish the GitHub Release once. Needs
  # contents:write to create the release.
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
